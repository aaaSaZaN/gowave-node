name: Candidate artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version embedded in the executable
        required: true
        default: 1.0.6-rc.1
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          case "$BUILD_VERSION" in *[!a-zA-Z0-9.+-]*|'') exit 1 ;; esac
          mkdir -p dist
          # GOARCH[:GOARM]; ARM builds are published as armv<GOARM>.
          for target in amd64 386 arm64 arm:7 arm:6 arm:5 riscv64 mips mipsle mips64 mips64le; do
            arch=${target%%:*}
            arm=7
            asset_arch=$arch
            case $target in arm:*) arm=${target#arm:}; asset_arch=armv$arm ;; esac
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM="$arm" GOMIPS=softfloat go build -trimpath -ldflags="-s -w -X main.AppVersion=$BUILD_VERSION" -o "dist/gowave-node-linux-$asset_arch" ./cmd/gowave-node
          done
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: bash scripts/build-asn.sh dist/asn-prefixes.zip
      - run: cp install.sh dist/ && cd dist && sha256sum gowave-node-* asn-prefixes.zip install.sh > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
